<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Videos — Badminton</title>
  <link rel="stylesheet" href="../assets/css/site.css">
  <style>
    .video-card { padding: 0; overflow: hidden; }
    .video-card .thumb-wrap {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #000;
      cursor: pointer;
    }
    .video-card .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .video-card .play {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 42px; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .video-card iframe { width: 100%; aspect-ratio: 16 / 9; border: 0; display: block; }
    .video-card .meta { padding: 10px 14px; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="brand"><a href="../index.html">🏸 Badminton</a></div>
    <nav>
      <a href="../index.html">Home</a>
      <a href="../tools/index.html">Tools</a>
      <a href="../training/index.html">Training</a>
      <a href="../media/gallery.html">Gallery</a>
    </nav>
  </header>

  <p class="breadcrumb"><a href="../index.html">Home</a> / Videos</p>
  <h1>Videos</h1>
  <p class="tagline">Training clips and match footage. Add entries to <code>data/videos.json</code> to grow this list.</p>

  <div class="tag-filter" id="tagFilter"></div>
  <div class="card-grid" id="grid">
    <p class="empty-state">Loading…</p>
  </div>

  <script src="../assets/js/site.js"></script>
  <script>
    (async function () {
      const grid = document.getElementById("grid");
      let videos;
      try {
        videos = await fetchJSON("../data/videos.json");
      } catch (err) {
        grid.innerHTML = '<p class="empty-state">Could not load videos.</p>';
        return;
      }

      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));

      function youtubeId(url) {
        const m = String(url).match(/(?:youtu\.be\/|v=|embed\/)([A-Za-z0-9_-]{11})/);
        return m ? m[1] : null;
      }

      const items = videos
        .map((v) => ({ ...v, ytId: youtubeId(v.url) }))
        .filter((v) => v.ytId)
        .sort((a, b) => (b.date || "").localeCompare(a.date || ""));

      if (items.length === 0) {
        grid.innerHTML = '<p class="empty-state">No videos yet — add an entry to data/videos.json.</p>';
        return;
      }

      grid.innerHTML = items.map((v, i) => `
        <div class="card video-card" data-tags="${esc((v.tags || []).join(","))}">
          <div class="thumb-wrap" data-play data-id="${esc(v.ytId)}" data-index="${i}">
            <img src="https://img.youtube.com/vi/${esc(v.ytId)}/hqdefault.jpg" alt="${esc(v.title)}" loading="lazy">
            <div class="play">▶</div>
          </div>
          <div class="meta">
            <h3>${esc(v.title)}</h3>
            <p class="date">${esc(v.date || "")}</p>
          </div>
        </div>
      `).join("");

      initTagFilter({
        items,
        tagField: "tags",
        filterBarSelector: "#tagFilter",
        cardSelector: ".video-card",
      });

      grid.addEventListener("click", (e) => {
        const el = e.target.closest("[data-play]");
        if (!el) return;
        const id = el.dataset.id;
        el.outerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1" title="YouTube video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
      });
    })();
  </script>
</body>
</html>
