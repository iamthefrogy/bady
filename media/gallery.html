<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Gallery - Bady</title>
  <link rel="stylesheet" href="../assets/css/site.css">
</head>
<body>
  <header class="site-header">
    <div class="brand"><a href="../index.html">Bady</a></div>
    <nav>
      <a href="../index.html">Home</a>
      <a href="../tools/index.html">Tools</a>
      <a href="../training/index.html">Training</a>
      <a href="../videos/index.html">Videos</a>
    </nav>
  </header>

  <p class="breadcrumb"><a href="../index.html">Home</a> / Gallery</p>
  <h1>Gallery</h1>
  <p class="tagline">Match and practice photos.</p>

  <div class="tag-filter" id="tagFilter"></div>
  <div class="media-grid" id="grid">
    <p class="empty-state">Loading…</p>
  </div>

  <script src="../assets/js/site.js"></script>
  <script>
    (async function () {
      const grid = document.getElementById("grid");
      let manifest;
      try {
        manifest = await fetchJSON("manifest.json");
      } catch (err) {
        grid.innerHTML = '<p class="empty-state">Could not load gallery.</p>';
        return;
      }

      const items = (manifest.items || []).slice().sort((a, b) => (b.date || "").localeCompare(a.date || ""));

      if (items.length === 0) {
        grid.innerHTML = '<p class="empty-state">No photos yet - check back soon.</p>';
        return;
      }

      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));

      grid.innerHTML = items.map((item) => `
        <div class="media-item" data-tags="${esc((item.tags || []).join(","))}">
          <img src="${esc(item.path.replace(/^media\//, ""))}" alt="${esc(item.title)}" loading="lazy">
          <div class="meta">
            <div class="title">${esc(item.title)}</div>
            <div class="date">${esc(item.date || "")}</div>
          </div>
        </div>
      `).join("");

      initTagFilter({
        items,
        tagField: "tags",
        filterBarSelector: "#tagFilter",
        cardSelector: ".media-item",
      });

      grid.addEventListener("click", (e) => {
        const img = e.target.closest(".media-item img");
        if (!img) return;
        const box = document.createElement("div");
        box.className = "lightbox";
        box.innerHTML = `<button type="button" class="lightbox-close">&times;</button><img src="${img.src}" alt="${img.alt}">`;
        box.addEventListener("click", () => box.remove());
        document.body.appendChild(box);
      });
    })();
  </script>
</body>
</html>
